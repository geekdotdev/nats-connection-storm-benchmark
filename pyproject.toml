[project]
name = "nats-connection-storm-benchmark"
version = "0.0.0"
description = "A/B benchmark of nats-server under a burst of authenticated WebSocket connections"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=44"]

[project.scripts]
bench = "stormbench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["driver/stormbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
