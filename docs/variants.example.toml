# Variants for `bench run --variants docs/variants.example.toml`: two or more configurations of the stack, compared in blocks.
# The first is the baseline. Every setting but the label and the image is optional; leave it out to keep what the overlay has.
# Nothing secret belongs here: the file's settings are recorded in the run's environment.json.
#
#   label         letters, digits and underscores; used in file names and the report
#   commit        a full 40 character nats-server sha: the broker image is <image prefix>nats-server:<first 12 characters>
#   image         the broker image as given (instead of, or as well as, a commit: then the commit is only recorded)
#   stack         a kustomize overlay under deploy/stack/overlays: topology and sizes (the target's default when left out)
#   conf          extra nats-server configuration, included after everything else (the broker's extra.conf), or
#   conf_file     a file with it, relative to this file
#   broker_env, callout_env       environment variables for those containers (quoted strings; not the ones the manifests wire)
#   broker_resources              cpu and memory, as both requests and limits (so the pod is Guaranteed)
#   callout_resources             the same for the callout; what it leaves out stays as the overlay has it
#   generator_resources           the same for the load generator's Job (set per storm). Preflight checks that the callout and the generator
#                                 fit the client node at once, with what the cluster already uses there: a bigger pair may need a second client node
#   callout_args  the callout's whole argument list, replacing the overlay's (so give `--url` too)
#   no_tls        true: a DIAGNOSTIC, never a production setting. The broker's WebSocket port listens without TLS (the driver adds the websocket block to the
#                 variant's extra.conf) and the generator goes to ws://broker:8443, both together so they cannot disagree. To see what TLS costs.
#   callout_replicas  how many callout pods run (1 to 10), all in one queue group so they share the work. Each has the overlay's (or the
#                 variant's callout_resources) CPU: 3 replicas of 1 CPU are 3 CPU of callout, and preflight checks they fit beside the generator
#   storm         generator STORM_* settings, on top of the run's (not the phase variables STORM_CONNECTIONS and the like, nor the
#                 key wiring STORM_SCOPED_SEED, STORM_AUTH_ACCOUNT and their _FILE forms; STORM_ROLES, STORM_TICKET_TTL_S and
#                 STORM_TIMEOUT_MS may be varied)
#
# All variants of a run must have the same Kubernetes objects (preflight checks it): they differ in settings, not in what exists.

[[variant]]
label = "main"
commit = "582fb8e939a77b6a33ef845955a208bdc222d767"

# Same broker, three brokers in a cluster instead of one.
[[variant]]
label = "cluster"
commit = "582fb8e939a77b6a33ef845955a208bdc222d767"
stack = "deploy/stack/overlays/eks-cluster"

# Same broker and topology as the baseline, with a smaller callout worker pool and a broker setting.
[[variant]]
label = "tuned"
commit = "582fb8e939a77b6a33ef845955a208bdc222d767"
conf = """
max_payload: 2MB
"""
callout_args = ["serve", "--url", "nats://broker:4222", "--workers", "8"]
[variant.broker_env]
GOGC = "50"
[variant.broker_resources]
cpu = "2"
memory = "4Gi"

# A bigger callout and generator, to see whether their CPU limits are what holds the burst back (they need a second client node:
# 2 + 4 CPU do not fit one c6i.xlarge beside the cluster's own pods).
# [[variant]]
# label = "bigger_callout"
# commit = "582fb8e939a77b6a33ef845955a208bdc222d767"
# [variant.callout_resources]
# cpu = "2"
# [variant.generator_resources]
# cpu = "3"
