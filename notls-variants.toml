# What does TLS cost a connection's setup? Same image digest, same callout, generator and broker CPU; the only difference is that the second
# variant's broker listens on its WebSocket port without TLS and the generator goes to ws:// (`no_tls = true` sets both together).
# A DIAGNOSTIC, never a production setting: it attributes setup time between the TLS handshake and everything else.
# `bench run --variants notls-variants.toml --blocks 8 --sizes 800,1600` (plans/tls-cost.md). `tls` is first and is the overlay's own setting,
# so the report's baseline is the default and `notls` is measured against it. Prediction and falsifier are in the plan, written before the run.

