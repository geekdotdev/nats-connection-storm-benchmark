# Who HOLDS the locks that connects wait on: main and nolock, each built with the mutex-profile patch
# (`bench images build <sha> --only nats-server --repo https://github.com/cfedersp/nats-server.git --patch mutex-profile`; images/README.md),
# with the broker's profiler on (profile.conf). `bench run --variants mutex-variants.toml`: the probes keep the broker's block and mutex profiles
# and `summary.txt` says who waited and who held the lock. Both variants carry the same one-line patch; they are comparable with each other
# and with nothing else, and a profiled run's timings are perturbed. The images are the amd64 and arm64 lists pushed to GHCR on 2026-11-21.

