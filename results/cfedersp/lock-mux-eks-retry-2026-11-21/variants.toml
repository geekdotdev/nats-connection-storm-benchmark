# The accConnsUpdate lock and the auth callout reply multiplexing, four ways: `bench run --variants lock-variants.toml`.
# The first variant is the baseline. Every image is pinned by digest (the amd64 and arm64 list pushed to GHCR on 2026-11-21, each
# checked to resolve anonymously), so a tag cannot move under a run; `commit` is recorded in the run's environment.json and says what
# the image was built from. All four differ only in the broker's source: same stack, same callout, same generator settings.
#
#   main        upstream main: accConnsUpdate takes a read lock (#8905)
#   nolock      feature/lockfree-acc-conns-update: an atomic pointer to the system send queue, so accConnsUpdate takes no server-wide lock
#   mux_main    feature/auth-callout-mux-on-main: main plus the auth callout reply multiplexing (one shared reply subscription per account)
#   mux_nolock  feature/auth-callout-mux-on-lockfree: the same multiplexing on top of nolock
#
# The branches are on github.com/cfedersp/nats-server. The mux change is an experiment set aside on 2026-11-16 and applied to each base
# unchanged but for the test file's merge; it was checked with `go test -race -run TestAuthCallout`, not the full nats-server suite.

