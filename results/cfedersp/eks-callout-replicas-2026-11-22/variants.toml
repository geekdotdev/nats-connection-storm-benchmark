# Is the auth callout what paces the burst? Same broker, same image digest, same generator; the only difference is how many callout pods run.
# `bench run --variants callout-replicas-variants.toml --blocks 8 --sizes 800,1600` (plans/callout-replicas.md). Needs a second client node
# (`bench cluster scale --target eks --client-nodes 2 --yes`, and back to 1 afterwards): 3 callout pods of 1 CPU plus the 2 CPU generator do
# not fit one c6i.xlarge beside the cluster's own pods (preflight's "fit together" says so).
# The replicas share one queue group, so they share the work: 3 pods of 1 CPU (16 workers each) are 3 CPU and 48 workers of callout.
# Both variants run in the SAME blocks, interleaved, so the comparison is within one run (the only kind the report tests). Prediction and
# falsifier are in the plan, written before the run.

