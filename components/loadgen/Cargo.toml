[package]
name = "auth-storm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Connection-storm generator for nats-server: N WebSocket connections at once, timed from CONNECT to the broker's answer"
publish = false

[dependencies]
futures-util = "0.3.34"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
