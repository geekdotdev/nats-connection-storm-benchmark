# The local cluster for smoke tests: one node. Create it with its own kubeconfig file so the kubectl
# context in ~/.kube/config is never switched:
#   KIND_EXPERIMENTAL_PROVIDER=podman kind create cluster --config infra/kind/cluster.yaml --kubeconfig .kube/storm-bench
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: storm-bench
nodes:
  - role: control-plane
