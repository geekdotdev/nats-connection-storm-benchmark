# SPDX-License-Identifier: Apache-2.0
# The StorageClass for EBS volumes (gp3), provisioned by the EBS CSI driver add-on. The cluster's own `gp2` class uses the old in-tree
# provisioner, which current Kubernetes no longer has, so a claim on it cannot bind. One volume belongs to one availability zone and, as gp3,
# attaches to one node at a time (ReadWriteOnce; only io1/io2 can Multi-Attach, and only as raw block volumes). WaitForFirstConsumer makes
# it in the zone of the node its pod lands on.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
