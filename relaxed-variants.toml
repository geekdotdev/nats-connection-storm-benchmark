# The single-account idea: can accConnsUpdate be relaxed where one account carries the connections and no peer relies on its count?
# `bench run --variants relaxed-variants.toml`. main (the read lock) and nolock (the atomic send-queue pointer) as before, and `relaxed`:
# nolock plus images/nats-server/patches/relaxed-acc-conns.patch, which sends one connection-count update per account per 100 ms instead of
# an event for every client added or removed, with no account lock on the connect path. `relaxed` differs from `nolock` by that and nothing else.
# Prediction written before the run: relaxed is faster than nolock in auth p50 and in 90%-admitted-by at 800 and 1600. Falsifier: relaxed is
# about equal to nolock (then the lock was the cost and the event is cheap). Images are the amd64 and arm64 lists pushed to GHCR on 2026-11-21.
# Not profiled (no conf_file): timings are not perturbed. Cross-server limit enforcement is what is given up: the standalone stack has no peers.

