# SPDX-License-Identifier: Apache-2.0
# Prometheus, keeping the CPU series of the benchmark's containers (what the probes serve) on a PersistentVolumeClaim: an EBS volume on EKS
# (overlays/eks), the node's local disk on kind. One replica, one writer, and a real filesystem: Prometheus's own documentation says its
# database must not be on NFS, EFS included. The image is pinned by digest (the multi-platform index of v3.15.1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: storm-bench-monitoring}
data:
  prometheus.yml: |
    global:
      scrape_interval: 1s      # the probes read the cgroups when they are scraped, so a scrape is an exact reading: 1 s resolution
      scrape_timeout: 1s
    scrape_configs:
      - job_name: cpuprobe
        dns_sd_configs:
          - names: ["cpuprobe.storm-bench.svc.cluster.local"]   # the headless Service: one A record per probe pod
            type: A
            port: 9100
            refresh_interval: 5s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: storm-bench-monitoring}
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: storm-bench-monitoring}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534                # the volume is writable by the group Prometheus runs as
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2   # v3.15.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=14d
            - --web.listen-address=:9090
          ports:
            - {name: web, containerPort: 9090}
          readinessProbe: {httpGet: {path: /-/ready, port: web}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /-/healthy, port: web}, periodSeconds: 10, failureThreshold: 6}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}   # a run's series are a few megabytes: the size is the volume's minimum use, not a need
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: storm-bench-monitoring}
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports:
    - {name: web, port: 9090, targetPort: web}
