# SPDX-License-Identifier: Apache-2.0
# EKS: the probe image is pinned by digest (cpuprobe:src-4682f1886471 pushed on 2026-11-21, amd64 and arm64: with the broker block and mutex profile harvester; rebuild, push and replace it
# when components/cpuprobe changes). EDIT `newName` to your registry account. Prometheus's claim is an EBS gp3 volume (the CSI driver and the
# StorageClass come from `bench cluster addons`), and the pod runs on the `infra` node group (`bench cluster infra`), which only it uses:
# a volume attaches to one node, in one zone, and the benchmark's brokers and clients should not share a node with its disk writes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: cpuprobe
    newName: ghcr.io/cfedersp/cpuprobe
    digest: sha256:305ae94ea239ba26cd9f8d018e0861353f5c6f8a60b12bed195f49ce1cca242d   # cpuprobe:src-4682f1886471, amd64 and arm64
patches:
  - target: {kind: StatefulSet, name: prometheus}
    patch: |-
      - {op: add, path: /spec/volumeClaimTemplates/0/spec/storageClassName, value: gp3}
      - {op: add, path: /spec/template/spec/nodeSelector, value: {role: infra}}
      - {op: add, path: /spec/template/spec/tolerations, value: [{key: dedicated, operator: Equal, value: infra, effect: NoSchedule}]}
