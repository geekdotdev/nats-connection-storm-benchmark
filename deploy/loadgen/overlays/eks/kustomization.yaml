# SPDX-License-Identifier: Apache-2.0
# EKS: the load generator runs on the clients node group, away from the brokers. The image is pinned by digest (the list pushed on
# 2026-11-21 for loadgen:src-d4e091f900ab, amd64 and arm64); rebuild, push and replace it when the source changes. EDIT `newName` to your
# registry account.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: loadgen
    newName: ghcr.io/cfedersp/loadgen
    digest: sha256:a6df6c387d57833c83f79c029422b7beee3b074cda2329dbdad11d8c63f9fda4   # loadgen:src-d4e091f900ab, amd64 and arm64
patches:
  - target: {kind: Job, name: loadgen}
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata: {name: loadgen}
      spec:
        template:
          spec:
            nodeSelector: {role: client}
            containers:
              - name: loadgen
                resources:
                  requests: {cpu: "2", memory: 1Gi}
                  limits: {cpu: "2", memory: 1Gi}
