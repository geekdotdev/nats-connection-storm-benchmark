# One storm run: the generator opens STORM_CONNECTIONS connections at once, STORM_RUNS times, each presenting its own ticket (a user JWT
# signed by the scoped signing key in the Secret storm-generator-auth, which the callout pod's init container makes: components/provision),
# and prints its report to
# stdout (the last line starts STORM_REPORT_JSON). A Job is immutable and runs once, so it is not part of the stack: the
# driver deletes the previous one and applies a new one per block, with STORM_LABEL set.
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen
  labels: {app.kubernetes.io/name: loadgen, app.kubernetes.io/part-of: storm-bench}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: loadgen, app.kubernetes.io/part-of: storm-bench}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loadgen
          image: loadgen
          imagePullPolicy: IfNotPresent
          env:
            - {name: STORM_URL, value: "wss://broker:8443"}
            - {name: STORM_CA_FILE, value: /etc/storm/tls/ca.pem}
            - {name: STORM_SCOPED_SEED_FILE, value: /etc/storm/generator/scoped.seed}
            - {name: STORM_AUTH_ACCOUNT_FILE, value: /etc/storm/generator/auth.pub}
            - {name: STORM_CONNECTIONS, value: "800"}
            - {name: STORM_RUNS, value: "8"}
            - {name: STORM_PAUSE_MS, value: "1500"}
            - {name: STORM_HOLD_MS, value: "1000"}
            - {name: STORM_THREADS, value: "4"}
            - {name: STORM_LABEL, value: run}
            - {name: STORM_JSON, value: "-"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tls, mountPath: /etc/storm/tls, readOnly: true}
            - {name: generator-auth, mountPath: /etc/storm/generator, readOnly: true}
      volumes:
        - name: tls
          secret:
            secretName: storm-tls
            items: [{key: ca.pem, path: ca.pem}]
        - name: generator-auth
          secret:
            secretName: storm-generator-auth
            items: [{key: scoped.seed, path: scoped.seed}, {key: auth.pub, path: auth.pub}]
