# SPDX-License-Identifier: Apache-2.0
# EKS (cluster from infra/eks, made by `bench cluster up --target eks`). One broker; the cluster variant is the sibling overlay eks-cluster.
#
# Placement: brokers run on the tainted `brokers` node group, one per node, with requests equal to limits (so the
# kubelet gives them dedicated CPU). The callout runs on the `clients` node group.
# Sizes assume the default 4 vCPU / 8 GiB node (c6i.xlarge): change them together with --instance-type.
#
# Images come from GHCR and are pulled without credentials, so the packages must be public. The broker is pinned by
# digest, not tag (the digest is the list pushed for nats-server 582fb8e93, amd64 and arm64): it has no benchmark code in it.
# The callout and provision images are pinned by digest too (the lists pushed on 2026-11-21 for callout:src-3cff67e67dd2 and
# provision:src-c1a3acc650f6, amd64 and arm64). The tag in the comment names the source, because the digest does not: rebuild and push
# (`bench images build --only callout,loadgen,provision --platform linux/amd64,linux/arm64`, `bench images push ...`) and replace the
# digests when the source changes. EDIT `newName` to your registry account.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: nats-server
    newName: ghcr.io/cfedersp/nats-server
    digest: sha256:7e89e5a9ad5adf167322479a901b13df6750f4ff7ec3e254eaffa00113aedf5d
  - name: callout
    newName: ghcr.io/cfedersp/callout
    digest: sha256:21ca37a09635ed93f8ef7ef55c841e003dea3795ebdddfcfdf20b99a1f49ed23   # callout:src-3cff67e67dd2, amd64 and arm64
  - name: provision
    newName: ghcr.io/cfedersp/provision
    digest: sha256:b01b5bc532eac54cd7b0e97f9fd60266527f8e54158138628d3e2f0122ae81f1   # provision:src-c1a3acc650f6, amd64 and arm64
patches:
  - target: {kind: StatefulSet, name: broker}
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: broker}
      spec:
        template:
          spec:
            nodeSelector: {role: broker}
            tolerations:
              - {key: dedicated, operator: Equal, value: broker, effect: NoSchedule}
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector: {matchLabels: {app.kubernetes.io/name: broker}}
                    topologyKey: kubernetes.io/hostname
            containers:
              - name: broker
                resources:
                  requests: {cpu: "3", memory: 4Gi}
                  limits: {cpu: "3", memory: 4Gi}
  - target: {kind: Deployment, name: callout}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: callout}
      spec:
        template:
          spec:
            nodeSelector: {role: client}
            containers:
              - name: callout
                resources:
                  requests: {cpu: 500m, memory: 256Mi}
                  limits: {cpu: 500m, memory: 256Mi}
