# kind. Images are the ones loaded into the cluster (podman names them localhost/...); the driver overrides
# the broker's tag per arm. Small requests, no limits, no node pinning: numbers from here are for smoke tests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - {name: nats-server, newName: localhost/nats-server, newTag: dev}
  - {name: callout, newName: localhost/callout, newTag: dev}
  - {name: provision, newName: localhost/provision, newTag: dev}
patches:
  - target: {kind: StatefulSet, name: broker}
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: broker}
      spec: {template: {spec: {containers: [{name: broker, resources: {requests: {cpu: 250m, memory: 128Mi}}}]}}}
  - target: {kind: Deployment, name: callout}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: callout}
      spec: {template: {spec: {containers: [{name: callout, resources: {requests: {cpu: "1", memory: 64Mi}}}]}}}
