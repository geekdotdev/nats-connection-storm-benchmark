# Leaf nodes: the brokers accept leaf connections, and two small stand-alone servers (the `leaf` Deployment, defined in the base at zero replicas) connect to them.
# Add it to an overlay with `components: [../../components/leafnodes]`; it works with one broker or with the cluster component.
#
# The leaf connections are authenticated by the leafnodes block's own user, which binds them to account A0 (the callout is
# not involved). The password is the leaf-password key of the storm-secrets Secret.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: Deployment, name: leaf}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: leaf}
      spec: {replicas: 2}
  - target: {kind: StatefulSet, name: broker}
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: broker}
      spec:
        template:
          spec:
            containers:
              - name: broker
                env:
                  - name: LEAF_PASSWORD
                    valueFrom: {secretKeyRef: {name: storm-secrets, key: leaf-password}}
                ports:
                  - {name: leaf, containerPort: 7422}
  - target: {kind: Service, name: broker}
    patch: |-
      apiVersion: v1
      kind: Service
      metadata: {name: broker}
      spec:
        ports:
          - {name: leaf, port: 7422}
  - target: {kind: ConfigMap, name: storm-broker-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: storm-broker-config}
      data:
        leafnodes.conf: |
          leafnodes {
            listen: 0.0.0.0:7422
            authorization {
              user: leaf
              password: $LEAF_PASSWORD
              account: A0
            }
          }
