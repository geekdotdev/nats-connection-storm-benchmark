# The benchmark broker's configuration, in operator mode: it trusts an operator and finds its accounts through a resolver, and clients
# present user JWTs that the auth callout answers (see docs/operator-mode-plan.md). Nothing secret is in this file or in the
# ConfigMap storm-operator it includes: the operator, the system account and the account resolver are written by components/provision
# (the callout pod's init container) as operator.conf and resolver-memory.conf, and the broker holds no seed. The TLS key pair is
# mounted from the storm-tls Secret.
#
# This is the single-server configuration. The optional part is a separate file that nats-server includes, empty here and filled in by
# the Kustomize component deploy/stack/components/cluster: cluster.conf (routes between brokers). extra.conf, included last, is empty
# here: a variant of a run (see docs/variants.example.toml) puts its extra nats-server settings there. server_name is the pod name, so
# the servers of a cluster are distinct.
apiVersion: v1
kind: ConfigMap
metadata:
  name: storm-broker-config
data:
  nats-server.conf: |
    server_name: $POD_NAME
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222
    # A user JWT in CONNECT is longer than a username and password.
    max_control_line: 16384

    websocket {
      listen: 0.0.0.0:8443
      tls {
        cert_file: "/etc/storm/tls/tls.crt"
        key_file: "/etc/storm/tls/tls.key"
      }
    }

    # operator, system_account and the account resolver (components/provision). nats-server joins an include path to
    # the directory of the file that includes it, even an absolute one, so these climb out of /etc/nats to the
    # mount at /etc/storm/operator.
    include "../storm/operator/operator.conf"
    include "../storm/operator/resolver-memory.conf"

    # How long the broker waits for the auth callout to answer.
    authorization {
      timeout: 10s
    }

    include "cluster.conf"
    include "extra.conf"
  cluster.conf: |
    # single server: no cluster
  extra.conf: |
    # no extra settings
